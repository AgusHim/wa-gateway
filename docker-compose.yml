services:
  postgres:
    image: postgres:18-alpine
    container_name: wa-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wa_gateway
    ports:
      - "5433:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "PGPASSWORD=password psql -h 127.0.0.1 -U postgres -d wa_gateway -c 'SELECT 1' > /dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:8.6-alpine
    container_name: wa-gateway-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gushim/wa-buzzerp:latest
    container_name: wa-gateway-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/wa_gateway?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
